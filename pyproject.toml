[project]
name = "eventbrite-mcp-server"
version = "0.1.0"
description = "Comprehensive Eventbrite API v3 Model Context Protocol (MCP) Server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
