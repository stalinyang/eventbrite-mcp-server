[project]
name = "eventbrite-mcp-server"
version = "0.2.0"
description = "Comprehensive Eventbrite API v3 Model Context Protocol (MCP) Server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
eventbrite-mcp = "eventbrite.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eventbrite"]
